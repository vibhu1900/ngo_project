
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.jpeg" />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#1f4d3a" />

    <!-- SEO -->
    <meta
      name="description"
      content="UKSSOVM is a non-governmental organization working for social welfare, community development, education, healthcare, women empowerment, child welfare, and sustainable development."
    />

    <meta
      name="keywords"
      content="NGO, Uttarakhand NGO, social welfare, community development, education, healthcare, women empowerment, child welfare, rural development, sustainable development, social service, NGO Uttarakhand, UKSSOVM"
    />

    <meta name="author" content="UKSSOVM" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Apple / Mobile -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="UKSSOVM - NGO & Social Welfare Organization" />
    <meta
      property="og:description"
      content="UKSSOVM works towards social welfare, community development, education, healthcare, women empowerment, child welfare, and sustainable development."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:image"
      content="%PUBLIC_URL%/og-image.jpg"
    />
    <meta property="og:site_name" content="UKSSOVM" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="UKSSOVM - NGO & Social Welfare Organization"
    />
    <meta
      name="twitter:description"
      content="Working for social welfare, community development, education, healthcare, women empowerment, child welfare, and sustainable development."
    />
    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/og-image.jpg"
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="UKSSOVM"
    />

    <!-- Security / Referrer -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Page Title -->
    <title>
      UKSSOVM
    </title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
